[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voss-forensic-core"
version = "0.2.0"
description = "Project-agnostic forensic reasoning core and live evidence adapters for Voss"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["voss_core", "voss_adapters"]

name: Workspace Startup Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor-autostart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject editor startup execution before dependencies
        run: python scripts/check_editor_source_safety.py
      - name: Check inert adversarial fixtures
        run: python -m unittest discover -s tests -p test_editor_source_safety.py -v
      - name: Reject hidden workspace startup execution
        run: python -m unittest discover -s tests -p test_workspace_startup_safety.py -v
